name: Build file index

# Runs whenever course files change, so the index never has to be rebuilt by hand.
# Pushes made by this workflow use GITHUB_TOKEN, which by design does not start
# another workflow run, so committing the index cannot loop.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/index.csv"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The index records the date each file last changed, which needs history.
          fetch-depth: 0

      - name: Rebuild and publish the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The branch can move while this job runs, for instance when two pushes
          # land close together. Rebuild against whatever is on the remote now and
          # retry, rather than failing and leaving the index stale.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            python3 tools/build_index.py

            if [ -z "$(git status --porcelain -- '*index.csv')" ]; then
              echo "Index already matches the files; nothing to commit."
              exit 0
            fi

            git add -- '*index.csv'
            git commit --quiet -m "Update file index"

            if git push --quiet; then
              echo "Index updated."
              exit 0
            fi

            echo "Branch moved during the run; rebuilding against it (attempt $attempt)."
          done

          echo "Could not publish the index after 3 attempts."
          exit 1
